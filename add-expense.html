
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense | Expense Tracker</title>
  <link rel="stylesheet" href="./add-expense.css">
  <script src="./add-expense.js" defer></script>
</head>
<body>

  <nav class="navbar">
    <a href="./index.html" class="logo">Expense Tracker</a>
    <a href="./index.html" class="back-link">← Dashboard</a>
  </nav>

  <main class="container">
    <section class="form-card">
      <div class="heading">
        <span class="eyebrow">TRACK YOUR SPENDING</span>
        <h1>Add Expense</h1>
        <p>Enter your expense details below.</p>
      </div>

      <form id="transaction-form">
        <div class="field">
          <label for="amount">Amount (PKR)</label>
          <input
            type="number"
            id="amount"
            placeholder="e.g. 1500"
            min="0.01"
            step="0.01"
            required
          >
        </div>

        <div class="field">
          <label for="description">Description</label>
          <input
            type="text"
            id="description"
            placeholder="e.g. Grocery shopping"
            maxlength="100"
            required
          >
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Expense Date</label>
          <input type="date" id="date" required>
        </div>

        <p id="form-message" role="status" aria-live="polite"></p>

        <div class="form-actions">
          <a href="./index.html" class="btn btn-cancel">Cancel</a>
          <button type="submit" class="btn btn-submit">
            Save Expense
          </button>
        </div>
      </form>
    </section>
  </main>

</body>
</html>
